dataloader:
  batch_size: 256
  eval_batch_size: 256
  num_workers: 0
  alpha: 0.1
  partition: "hetero"

model:
  embed_dim: 1024
  clip_model: "RN50"
  cnn_type: resnet18
  word_dim: 512
  cache_dir: /data/mmdata/log/MMCLIP/
  n_samples_inference: 1
  eval_method: matmul
  use_img_client: True
  use_txt_client: True
  use_mm_client: True
  client: 0.1
  momentum: 0.9

# optimizer configuration
optimizer:
  name: adamp
  learning_rate: 0.0002
  weight_decay: 0.0

# lr scheduler configuration
lr_scheduler:
  name: cosine_annealing
  T_max: 30

# criterion configuration
criterion:
  name: pcme
  init_negative_scale: 15
  init_shift: 15
  num_samples: 7
  vib_beta: 0
  criterion__negative_sampling_ratio: -1

# detailed training configuration
train:
  is_client: True
  server_dataset: Coco
  model_save_path: model_
  best_model_save_path: model_best.pth
  pretrain_epochs: 0
  finetune_epochs: 2
  finetune_lr_decay: 0.1
  log_step: 1000
  grad_clip: 2
  val_epochs: 1
  pretrain_val_epochs: 1
  use_fp16: True
  output_file: model.log
